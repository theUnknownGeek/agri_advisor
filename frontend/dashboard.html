<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farm Dashboard</title>


<link rel="stylesheet" href="css/styles.css">


</head>


<body>


<div class="dashboard">


<h1>🌾 Farm Dashboard</h1>



<div class="card-container">


<div class="card">

<h3>Crop</h3>

<p id="crop">
Loading...
</p>

</div>



<div class="card">

<h3>Soil Moisture</h3>

<p id="moisture">
Loading...
</p>

</div>




<div class="card">

<h3>Temperature</h3>

<p id="temperature">
Loading...
</p>

</div>





<div class="card">

<h3>Humidity</h3>

<p id="humidity">
Loading...
</p>

</div>




<div class="card">

<h3>Rain Probability</h3>

<p id="rain">
Loading...
</p>

</div>



</div>





<div class="recommendation">


<h2>🤖 AI Recommendation</h2>


<h3 id="decision">
Loading...
</h3>


<p id="reason">
</p>


<p>
Confidence:
<span id="confidence"></span>
</p>


<p>
Status:
<span id="status"></span>
</p>



</div>



</div>




<script src="js/api.js"></script>

<script src="js/dashboard.js"></script>


</body>

</html>
